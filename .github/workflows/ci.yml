name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # esbuild's binary is installed by its postinstall; with --ignore-scripts
      # above it has to be rebuilt explicitly.
      - run: npm rebuild esbuild
      - run: npm run build
      # The EVM tests run the compiled contracts from artifacts/, which git
      # does not track: compile first.
      - run: npm run build:contract
      - run: npm test
      # Runtime dependencies must be clean; the dev tree is reported but
      # does not fail the build on its own.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true

  hostile-page-and-replay:
    name: boundary tests only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The two trust boundaries, run on their own so a regression in either
      # is visible by job name.
      - run: node --test test/bus.test.mjs test/intent.test.mjs test/daemon-server.test.mjs test/solana-guard.test.mjs

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the commits of a pull request to scan exactly them.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript
      # Code Scanning (the SARIF upload) is available to public repositories
      # and to GitHub Advanced Security. While this repository is private the
      # analysis still runs and its results are kept as a workflow artifact.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event.repository.private
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 30
